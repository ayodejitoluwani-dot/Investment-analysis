name: Update Signal Desk data

on:
  schedule:
    # 22:17 UTC = 23:17 Lagos, Mon–Fri: after NGX and US markets close
    - cron: "17 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: signal-desk-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prices + news and run the model
        run: node scripts/update.mjs
      - name: Commit updated data
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Data update $(date -u +%F)"
            git push
          fi
